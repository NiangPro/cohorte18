<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion · PharmaGestion</title>
</head>
<body>
    <div>
        <img src="../images/logo.png" alt="" width="60" height="60">
        <p><strong>Pharmacie Ndèye Coumba</strong></p>
        <p><a href="../index.html">Retour au site</a></p>
    </div>

    <hr>

    <h1>Espace de gestion</h1>
    <p>Réservé à l'équipe de la pharmacie.</p>
    <form action="produits.html">
        <fieldset>
            <legend>Connexion</legend>
            <label for="email">Adresse e-mail</label><br>
            <input type="email" id="email" name="email" placeholder="prenom.nom@exemple.sn" required><br>
            <label for="mdp">Mot de passe</label><br>
            <input type="password" id="mdp" name="mot_de_passe" minlength="8" required><br>
            <input type="checkbox" id="souvenir" name="souvenir">
            <label for="souvenir">Se souvenir de moi</label><br><br>
            <input type="submit" value="Se connecter">
        </fieldset>
    </form>

    <hr>
    <p><small>PharmaGestion · espace réservé à l'équipe · projet pédagogique, données fictives</small></p>
</body>
</html>
