<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <fieldset>
        <legend align="center">Formulaire d'inscription</legend>

        <form action="">
            <label for="">Prenom</label><br>
            <input type="text" minlength="2" readonly value="Moussa" maxlength="10" placeholder="Veuillez entrer votre prenom" required><br>
            <label for="">Age</label><br>
            <input type="number" min="0" max="10"><br>
             <label for="">Prix</label><br>
            <input type="number" min="0" max="250" step="50"><br>
             <label for="">Quantite</label><br>
            <input type="number" min="0" max="10" step="0.1"><br>
            <br><br>

            <input type="submit" value="S'inscrire">
            <!-- <button type="reset">Annuler</button> -->
            <input type="reset" value="Annuler">
        </form>
    </fieldset>
</body>
</html>
