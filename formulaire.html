<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <fieldset>
        <legend align="center">Formulaire d'inscription</legend>

        <form action="">
            <label for="">Prenom</label><br>
            <input type="text" minlength="2"  value="Moussa" maxlength="10" placeholder="Veuillez entrer votre prenom" required><br>
            <label for="">Age</label><br>
            <input type="number" min="0" max="10"><br>
             <label for="">Prix</label><br>
            <input type="number" min="0" max="250" step="50"><br>
             <label for="">Quantite</label><br>
            <input type="number" min="0" max="10" step="0.1"><br>

            <label for="">Sexe</label><br>
            M<input type="radio" name="sexe" value="M">
            F<input type="radio" name="sexe" checked><br>

            <label for="">Langues</label><br>
            FR<input type="checkbox">
            WO<input type="checkbox" checked>
            ES<input type="checkbox">
            EN<input type="checkbox"><br>

            <label for="">Date de naissance</label><br>
            <input type="date"><br>

            <label for="">Date de creation</label><br>
            <input type="datetime-local"><br>
            <label for="">Heure de debut</label><br>
            <input type="time"><br>
            <label for="">Mois</label><br>
            <input type="month"><br>
            <label for="">Semaine</label><br>
            <input type="week"><br>

            <label for="">Couleur</label><br>
            <input type="color"><br>
            <label for="">Fichier</label><br>
            <input type="file"><br>
            <label for="">Mot de passe </label><br>
            <input type="password"><br>
            <label for="">Email</label><br>
            <input type="email" required><br>
            <label for="">Message</label><br>
            <textarea name="" cols="50" rows="6" id=""></textarea><br>
            <label for="">Pays</label><br>
            <select name="" id="">
                <option value="">Veuillez selectionner votre pays</option>
                <option value="" selected>Senegal</option>
                <option value="">Maroc</option>
                <option value="">Gambie</option>
                <option value="">Mali</option>
            </select>
            

            <br><br>
            <input type="submit" value="S'inscrire">
            <!-- <button type="reset">Annuler</button> -->
            <input type="reset" value="Annuler">
        </form>
    </fieldset>
</body>
</html>
